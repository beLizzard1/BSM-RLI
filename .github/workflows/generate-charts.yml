name: Generate & Commit Benchmark Charts

on:
  push:
    paths:
      - 'benchmarks/results/*.json'
      - 'benchmarks/*.json'
      - 'benchmarks/plot_sweep_comparison.py'
      - 'benchmarks/generate_plot_images.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plot-charts:
    name: Generate Charts & Plots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy

      - name: Generate Plot Images
        run: |
          python3 benchmarks/generate_plot_images.py || echo "Skipping generate_plot_images due to missing files"
          python3 benchmarks/plot_sweep_comparison.py || echo "Skipping plot_sweep_comparison due to missing files"

      - name: Upload Charts as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-plots
          path: experiments/plots/*.png
          if-no-files-found: ignore

      - name: Commit & Push Updated Charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add experiments/plots/*.png
          if git diff --staged --quiet; then
            echo "No chart updates to commit."
          else
            git commit -m "chore(ci): auto-update benchmark plots and comparison charts [skip ci]"
            git push
          fi
